<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragons</title>
    <link rel="manifest" href="data:application/json,{}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
            min-height: 700px;
            border: 1px solid #2a2a3a;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
        }

        #home-screen:active {
            transform: scale(0.97);
        }

        .dragon-eye {
            position: relative;
            width: 180px;
            height: 180px;
            background: radial-gradient(circle at 35% 35%, #f5e56b, #d4a017 60%, #8b5a00);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 200, 0, 0.6), 0 0 100px rgba(255, 100, 0, 0.3), inset 0 -10px 30px rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            border: 6px solid #2b1a0a;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .dragon-eye::before {
            content: '';
            position: absolute;
            top: -12px;
            left: -12px;
            right: -12px;
            bottom: -12px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3a2a1a, #1f140a 80%);
            z-index: -1;
            box-shadow: 0 0 30px #ff8800, inset 0 0 20px #ffaa33;
            border: 2px solid #5a3a1a;
        }

        .dragon-eye::after {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #ffdd55, #cc8800 70%, #663300);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
            border: 2px solid #8b5a00;
        }

        .dragon-head-svg {
            position: relative;
            z-index: 10;
            width: 100px;
            height: 100px;
            filter: drop-shadow(0 0 15px rgba(255, 100, 0, 0.8));
        }

        .home-text {
            color: #ccb27a;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            border-top: 1px solid #3a2a1a;
            padding-top: 20px;
            width: 80%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }
        .home-text span {
            color: #f5d742;
            font-weight: 700;
        }

        #menu-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
            padding: 10px 0 20px;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-item {
            background: linear-gradient(145deg, #222233, #13131e);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #eee;
            border: 1px solid #3a3a50;
            box-shadow: 0 8px 0 #0a0a0f, 0 12px 25px rgba(0,0,0,0.6);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            cursor: pointer;
        }

        .icon-item:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #0a0a0f;
        }

        .icon-emoji {
            font-size: 4.2rem;
            line-height: 1.2;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .icon-weapon-svg {
            width: 70px;
            height: 70px;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
        }

        .icon-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.06);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #4a4a60;
            color: #f0e6c5;
            text-shadow: 0 0 10px rgba(255,215,0,0.2);
        }

        .clave-pda-bg {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(255, 215, 0, 0.15);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,200,0,0.1);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
        }

        .back-btn {
            background: none;
            border: none;
            color: #bbaa88;
            font-size: 1.6rem;
            text-align: left;
            padding: 0 0 10px 0;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 300;
            transition: 0.2s;
            width: fit-content;
        }
        .back-btn:hover {
            color: #f5d742;
        }
        .back-btn span {
            font-size: 1rem;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .dragon-eye { width: 150px; height: 150px; }
            .dragon-head-svg { width: 80px; height: 80px; }
            .icon-emoji { font-size: 3.5rem; }
            .icon-item { min-height: 110px; padding: 15px 8px; }
            .icon-weapon-svg { width: 55px; height: 55px; }
            .icon-label { font-size: 0.7rem; letter-spacing: 1px; }
        }
    </style>
</head>
<body>
    <div class="app-container">

        <!-- PANTALLA D'INICI -->
        <div id="home-screen">
            <div class="dragon-eye">
                <svg class="dragon-head-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 15 C35 15 25 30 20 45 C15 60 25 75 35 80 C40 82 45 80 50 75 C55 80 60 82 65 80 C75 75 85 60 80 45 C75 30 65 15 50 15 Z" fill="#1a0f0a" stroke="#ffaa00" stroke-width="2"/>
                    <path d="M35 35 L45 42 L38 52 Z" fill="#ff6600"/>
                    <path d="M65 35 L55 42 L62 52 Z" fill="#ff6600"/>
                    <path d="M50 45 L42 65 L50 70 L58 65 Z" fill="#2b1a0a" stroke="#ff8800" stroke-width="1.5"/>
                    <path d="M30 25 L20 10 L35 18 Z" fill="#d4a017"/>
                    <path d="M70 25 L80 10 L65 18 Z" fill="#d4a017"/>
                    <circle cx="40" cy="45" r="4" fill="#ffee55"/>
                    <circle cx="60" cy="45" r="4" fill="#ffee55"/>
                </svg>
            </div>
            <div class="home-text">🔮 Toca per <span>accedir</span></div>
            <div style="margin-top: 30px; font-size: 0.7rem; color: rgba(255,215,0,0.2); letter-spacing: 4px; font-family: monospace;">CLAU PDA 8008206</div>
        </div>

        <!-- PANTALLA DE MENÚ -->
        <div id="menu-screen">
            <button class="back-btn" id="backBtn">← <span>Tornar</span></button>

            <div class="icon-grid">
                <!-- 1. ESCOPETA -->
                <a href="https://forms.office.com/r/kNUQlJQSld" target="_blank" rel="noopener noreferrer" class="icon-item external-link">
                    <svg class="icon-weapon-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="45" y="40" width="50" height="10" rx="3" fill="#333" stroke="#555" stroke-width="1.5"/>
                        <rect x="88" y="42" width="10" height="6" rx="2" fill="#444" stroke="#555" stroke-width="1"/>
                        <rect x="30" y="35" width="20" height="20" rx="4" fill="#2a2a2a" stroke="#555" stroke-width="1.5"/>
                        <rect x="14" y="38" width="20" height="16" rx="3" fill="#5a3a1a" stroke="#4a2a0a" stroke-width="1.5"/>
                        <rect x="14" y="38" width="20" height="4" rx="2" fill="#6a4a2a" opacity="0.5"/>
                        <rect x="36" y="52" width="12" height="18" rx="3" fill="#2a2a2a" stroke="#444" stroke-width="1.5"/>
                        <path d="M34 56 L50 56 L50 62 L34 62 Z" fill="none" stroke="#444" stroke-width="1.5"/>
                        <rect x="40" y="56" width="4" height="6" rx="1" fill="#555"/>
                        <rect x="45" y="50" width="42" height="6" rx="2" fill="#1a1a1a" stroke="#444" stroke-width="1"/>
                        <rect x="47" y="41" width="40" height="2" rx="1" fill="#555" opacity="0.4"/>
                        <rect x="32" y="37" width="16" height="2" rx="1" fill="#444" opacity="0.3"/>
                    </svg>
                    <div class="icon-label">ARMES</div>
                </a>

                <!-- 2. ESCUDO - BALÍSTIC -->
                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" rel="noopener noreferrer" class="icon-item external-link">
                    <div class="icon-emoji">🛡️</div>
                    <div class="icon-label">BALÍSTIC</div>
                </a>

                <!-- 3. FURGONETA - VEHICLES -->
                <a href="https://forms.office.com/r/kNUNUNNNzB" target="_blank" rel="noopener noreferrer" class="icon-item external-link">
                    <div class="icon-emoji">🚐</div>
                    <div class="icon-label">VEHICLES</div>
                </a>

                <!-- 4. CÀMERES -->
                <a href="https://segpubcat.eur.evidence.com/axon/device/device-search" target="_blank" rel="noopener noreferrer" class="icon-item external-link">
                    <div class="icon-emoji">📷</div>
                    <div class="icon-label">CÀMERES</div>
                </a>
            </div>

            <div class="clave-pda-bg">CLAU PDA 8008206</div>
        </div>

    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('backBtn');

        homeScreen.addEventListener('click', function() {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
            history.pushState({ menu: true }, '');
        });

        backBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        window.addEventListener('popstate', function() {
            if (menuScreen.style.display === 'flex') {
                menuScreen.style.display = 'none';
                homeScreen.style.display = 'flex';
            }
        });

        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                const win = window.open(url, '_system');
                if (!win || win.closed || typeof win.closed == 'undefined') {
                    window.location.href = url;
                }
            });
        });
    </script>
</body>
</html>
