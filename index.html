<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dracs</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #0a0a0f; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        
        .app-container {
            width: 100%; max-width: 420px; background: #0d0d12;
            border-radius: 40px; padding: 20px; box-shadow: 0 0 50px rgba(0,0,0,0.9);
            min-height: 600px; border: 1px solid #2a2a3a;
            display: flex; flex-direction: column;
            position: relative;
        }

        /* BARRA SUPERIOR FIJA EN EL MENÚ */
        #topBar {
            display: none; /* Amagat a la pantalla d'inici */
            align-items: center;
            justify-content: space-between;
            padding: 10px 0 20px 0;
            border-bottom: 1px solid #2a1a0a;
            margin-bottom: 20px;
            width: 100%;
        }

        .back-btn-top {
            background: #2a2a3a;
            border: 1px solid #444;
            color: #ff2200;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }

        #home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; flex-grow: 1; text-align: center; cursor: pointer; }
        #menu-screen { display: none; flex-direction: column; width: 100%; flex-grow: 1; }

        .dragon-image-wrapper { width: 200px; height: 200px; border-radius: 50%; border: 3px solid #ff2200; margin-bottom: 30px; overflow: hidden; }
        .dragon-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .icon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .icon-item { background: #1a1a22; border-radius: 20px; padding: 20px 10px; text-align: center; text-decoration: none; color: #ccc; border: 1px solid #2a2a3a; }
        .icon-emoji { font-size: 2.5rem; margin-bottom: 5px; }
        .icon-label { font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
    </style>
</head>

<body>
    <div class="app-container">
        
        <!-- BARRA SUPERIOR: APAREIX NOMÉS AL MENÚ -->
        <div id="topBar" class="top-bar">
            <button class="back-btn-top" id="backBtn">◀ TORNAR</button>
            <div style="color: #8a7a5a; font-weight: bold;">DRACS PDA</div>
        </div>

        <!-- PANTALLA INICI -->
        <div id="home-screen">
            <div class="dragon-image-wrapper"><img src="ojo_dragon.jpg" alt="Ull"></div>
            <div style="color: #8a7a5a;">TOCA PER ACCEDIR</div>
        </div>

        <!-- PANTALLA MENÚ -->
        <div id="menu-screen">
            <div class="icon-grid">
                <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=5IJ0qb4dJUyik3gOc3n0niAcJ-nHf9hBsq5xpGjE_kNUQlJQSldCMDEzNjFZTFo5OFdYVjBHNTRVUCQlQCN0PWcu&origin=QRCode" target="_blank" class="icon-item external-link"><div class="icon-emoji">⚔️</div><div class="icon-label">ARMES</div></a>
                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" class="icon-item external-link"><div class="icon-emoji">🛡️</div><div class="icon-label">BALÍSTIC</div></a>
                <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=5IJ0qb4dJUyik3gOc3n0niAcJ-nHf9hBsq5xpGjE_kNUNUNNNzBLUEFDUzJaVjkxQzhMU0hQUDdMTiQlQCN0PWcu" target="_blank" class="icon-item external-link"><div class="icon-emoji">🚐</div><div class="icon-label">VEHICLES</div></a>
                <a href="https://segpubcat.eur.evidence.com/axon/device/device-search" target="_blank" class="icon-item external-link"><div class="icon-emoji">📷</div><div class="icon-label">CÀMERES</div></a>
            </div>
        </div>
    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const topBar = document.getElementById('topBar');
        const backBtn = document.getElementById('backBtn');

        // Al fer clic a la pantalla d'inici, amaguem l'inici i mostrem el menú amb la barra superior
        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
            topBar.style.display = 'flex'; 
        });

        // Botó tornar: amaguem el menú i la barra, mostrem l'inici
        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            topBar.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        // Enllaços externs
        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                window.open(this.getAttribute('href'), '_system');
            });
        });
    </script>
</body>
</html>
