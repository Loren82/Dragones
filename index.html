<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragons</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
            min-height: 700px;
            border: 1px solid #2a2a3a;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
        }

        #home-screen:active {
            transform: scale(0.97);
        }

        .dragon-image-wrapper {
            width: 250px;
            height: 250px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 0 60px rgba(200, 50, 0, 0.4),
                0 0 120px rgba(100, 0, 0, 0.3),
                inset 0 0 60px rgba(0,0,0,0.9);
            border: 2px solid rgba(255, 68, 0, 0.5);
            margin-bottom: 30px;
            background-color: #0a0505;
        }

        .dragon-image-wrapper svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .home-text {
            color: #8a7a5a;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            border-top: 1px solid #2a1a0a;
            padding-top: 20px;
            width: 80%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .home-text span {
            color: #ff4400;
            font-weight: 700;
        }

        #menu-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
            padding: 10px 0 20px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-item {
            background: linear-gradient(145deg, #1a1a22, #0d0d12);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            border: 1px solid #2a2a3a;
            box-shadow: 0 8px 0 #050508, 0 12px 25px rgba(0,0,0,0.8);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            cursor: pointer;
        }

        .icon-item:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #050508;
        }

        .icon-emoji {
            font-size: 4.2rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .icon-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.04);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a3a4a;
            color: #c0b090;
            text-shadow: 0 0 10px rgba(200,180,100,0.1);
        }

        .clave-pda-bg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(200, 180, 100, 0.08);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(200,180,100,0.05);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
        }

        .back-btn {
            background: none;
            border: none;
            color: #8a7a5a;
            font-size: 1.6rem;
            padding-bottom: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 300;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #c4a030;
        }

        @keyframes dragonPulse {
            0%, 100% { 
                filter: drop-shadow(0 0 30px rgba(255,68,0,0.3));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 80px rgba(255,68,0,0.7));
                transform: scale(1.03);
            }
        }

        .dragon-image-wrapper {
            animation: dragonPulse 2.5s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="app-container">

        <!-- PANTALLA INICIO -->
        <div id="home-screen">
            <div class="dragon-image-wrapper">
                <!-- DRAGÓN SIMPLE Y CLARO - ESTILO JUEGO DE TRONOS -->
                <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                    <!-- Fondo oscuro -->
                    <rect width="300" height="300" fill="#050302"/>
                    
                    <!-- Cara principal - gris oscuro para destacar -->
                    <ellipse cx="150" cy="145" rx="105" ry="115" fill="#1a0e0a"/>
                    <ellipse cx="150" cy="145" rx="95" ry="105" fill="#2a1510"/>
                    
                    <!-- Cuernos principales - AFILADOS -->
                    <path d="M70 100 L25 15 L90 80 L55 25 L110 90" fill="#1a0a05" stroke="#3a2010" stroke-width="2"/>
                    <path d="M230 100 L275 15 L210 80 L245 25 L190 90" fill="#1a0a05" stroke="#3a2010" stroke-width="2"/>
                    
                    <!-- Cuernos secundarios -->
                    <path d="M85 85 L55 35 L100 80" fill="#1a0a05" stroke="#3a2010" stroke-width="1.5"/>
                    <path d="M215 85 L245 35 L200 80" fill="#1a0a05" stroke="#3a2010" stroke-width="1.5"/>
                    
                    <!-- OJOS - GRANDES Y ROJOS BRILLANTES -->
                    <ellipse cx="115" cy="125" rx="38" ry="33" fill="#0a0200" stroke="#3a1005" stroke-width="2"/>
                    <ellipse cx="185" cy="125" rx="38" ry="33" fill="#0a0200" stroke="#3a1005" stroke-width="2"/>
                    
                    <!-- Globo ocular ROJO FUERTE -->
                    <ellipse cx="115" cy="125" rx="32" ry="28" fill="#ff0000"/>
                    <ellipse cx="185" cy="125" rx="32" ry="28" fill="#ff0000"/>
                    
                    <!-- Pupila VERTICAL NEGRA -->
                    <ellipse cx="115" cy="125" rx="5" ry="22" fill="#000000"/>
                    <ellipse cx="185" cy="125" rx="5" ry="22" fill="#000000"/>
                    
                    <!-- Brillo en los ojos - BLANCO/AMARILLO -->
                    <ellipse cx="107" cy="115" rx="10" ry="6" fill="#ffaa44" opacity="0.8"/>
                    <ellipse cx="177" cy="115" rx="10" ry="6" fill="#ffaa44" opacity="0.8"/>
                    
                    <!-- Cejas - AGRESIVAS -->
                    <path d="M72 100 L120 85 L142 95" stroke="#0d0806" stroke-width="7" fill="none" stroke-linecap="round"/>
                    <path d="M228 100 L180 85 L158 95" stroke="#0d0806" stroke-width="7" fill="none" stroke-linecap="round"/>
                    
                    <!-- Boca - ABIERTA -->
                    <path d="M85 210 Q150 280 215 210" fill="#0a0302" stroke="#3a1a0a" stroke-width="2.5"/>
                    
                    <!-- DIENTES SUPERIORES - AFILADOS -->
                    <path d="M95 210 L103 248 L111 210" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M118 207 L126 253 L134 207" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M141 205 L149 258 L157 205" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M164 205 L172 258 L180 205" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M187 207 L195 253 L203 207" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M210 210 L218 248 L226 210" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    
                    <!-- COLMILLOS INFERIORES -->
                    <path d="M108 248 L118 225 L128 248" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M133 253 L143 228 L153 253" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M158 258 L168 230 L178 258" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M183 253 L193 228 L203 253" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    
                    <!-- Lengua - ROJA -->
                    <path d="M125 230 Q150 255 175 230" fill="#cc0000" stroke="#880000" stroke-width="1.5"/>
                    <path d="M150 245 L143 262" stroke="#cc0000" stroke-width="2" fill="none"/>
                    <path d="M150 245 L157 262" stroke="#cc0000" stroke-width="2" fill="none"/>
                    
                    <!-- FUEGO - LLAMAS NARANJA -->
                    <path d="M115 270 Q150 320 185 270" fill="#ff4400" opacity="0.6"/>
                    <path d="M125 275 Q150 300 175 275" fill="#ff8800" opacity="0.5"/>
                    <path d="M135 278 Q150 290 165 278" fill="#ffcc00" opacity="0.4"/>
                    
                    <!-- NARIZ -->
                    <ellipse cx="137" cy="170" rx="10" ry="7" fill="#050302" stroke="#2a1008" stroke-width="1.5"/>
                    <ellipse cx="163" cy="170" rx="10" ry="7" fill="#050302" stroke="#2a1008" stroke-width="1.5"/>
                    
                    <!-- CICATRIZ - CLARA -->
                    <path d="M85 145 L100 135 L95 155" stroke="#3a1a0a" stroke-width="2.5" fill="none"/>
                    <path d="M88 148 L105 142" stroke="#3a1a0a" stroke-width="2" fill="none"/>
                    
                    <!-- ALETAS LATERALES -->
                    <path d="M50 200 L15 220 L35 250 L60 225" fill="#1a0a05" stroke="#2a1510" stroke-width="1.5"/>
                    <path d="M250 200 L285 220 L265 250 L240 225" fill="#1a0a05" stroke="#2a1510" stroke-width="1.5"/>
                    
                    <!-- ESCAMAS EN LA FRENTE -->
                    <path d="M135 105 L142 95 L149 105 L142 115 Z" fill="#3a1a10" stroke="#4a2a18" stroke-width="0.5"/>
                    <path d="M149 100 L156 90 L163 100 L156 110 Z" fill="#3a1a10" stroke="#4a2a18" stroke-width="0.5"/>
                    <path d="M163 105 L170 95 L177 105 L170 115 Z" fill="#3a1a10" stroke="#4a2a18" stroke-width="0.5"/>
                </svg>
            </div>

            <div class="home-text">🔮 Toca para <span>acceder</span></div>

            <div style="margin-top: 30px; font-size: 0.7rem; color: rgba(200,180,100,0.15); letter-spacing: 4px; font-family: monospace;">
                CLAU PDA 8008206
            </div>
        </div>

        <!-- PANTALLA MENÚ -->
        <div id="menu-screen">
            <button class="back-btn" id="backBtn">← <span>Volver</span></button>

            <div class="icon-grid">
                <a href="https://forms.office.com/r/kNUQlJQSld" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">⚔️</div>
                    <div class="icon-label">ARMAS</div>
                </a>

                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🛡️</div>
                    <div class="icon-label">BALÍSTICO</div>
                </a>

                <a href="https://forms.office.com/r/kNUNUNNNzB" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🚐</div>
                    <div class="icon-label">VEHÍCULOS</div>
                </a>

                <a href="https://segpubcat.eur.evidence.com/axon/device/device-search" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">📷</div>
                    <div class="icon-label">CÁMARAS</div>
                </a>
            </div>

            <div class="clave-pda-bg">CLAU PDA 8008206</div>
        </div>

    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('backBtn');

        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                const win = window.open(url, '_system');
                if (!win || win.closed || typeof win.closed == 'undefined') {
                    window.location.href = url;
                }
            });
        });
    </script>
</body>
</html>
