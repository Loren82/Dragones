<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragons</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
            min-height: 700px;
            border: 1px solid #2a2a3a;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
        }

        #home-screen:active {
            transform: scale(0.97);
        }

        .dragon-image-wrapper {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 0 60px rgba(200, 50, 0, 0.3),
                0 0 120px rgba(100, 0, 0, 0.2),
                inset 0 0 40px rgba(0,0,0,0.9);
            border: 1px solid rgba(100, 50, 20, 0.4);
            margin-bottom: 30px;
            background-color: #050302;
        }

        .dragon-image-wrapper svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .home-text {
            color: #8a7a5a;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            border-top: 1px solid #2a1a0a;
            padding-top: 20px;
            width: 80%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .home-text span {
            color: #c4a030;
            font-weight: 700;
        }

        #menu-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
            padding: 10px 0 20px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-item {
            background: linear-gradient(145deg, #1a1a22, #0d0d12);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            border: 1px solid #2a2a3a;
            box-shadow: 0 8px 0 #050508, 0 12px 25px rgba(0,0,0,0.8);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            cursor: pointer;
        }

        .icon-item:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #050508;
        }

        .icon-emoji {
            font-size: 4.2rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .icon-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.04);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a3a4a;
            color: #c0b090;
            text-shadow: 0 0 10px rgba(200,180,100,0.1);
        }

        .clave-pda-bg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(200, 180, 100, 0.08);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(200,180,100,0.05);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
        }

        .back-btn {
            background: none;
            border: none;
            color: #8a7a5a;
            font-size: 1.6rem;
            padding-bottom: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 300;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #c4a030;
        }

        /* Animación siniestra del dragón */
        @keyframes dragonBreath {
            0%, 100% { 
                filter: drop-shadow(0 0 30px rgba(150, 40, 0, 0.3));
                transform: scale(1) rotate(0deg);
            }
            50% { 
                filter: drop-shadow(0 0 60px rgba(200, 50, 0, 0.5));
                transform: scale(1.02) rotate(1deg);
            }
        }

        .dragon-image-wrapper {
            animation: dragonBreath 4s ease-in-out infinite;
        }

        @keyframes eyeGlow {
            0%, 100% { opacity: 0.9; }
            50% { opacity: 1; }
        }

        .eye-glow {
            animation: eyeGlow 2s ease-in-out infinite alternate;
        }
    </style>
</head>

<body>
    <div class="app-container">

        <!-- PANTALLA INICIO -->
        <div id="home-screen">
            <div class="dragon-image-wrapper">

                <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">

                    <!-- Niebla/ceniza de fondo -->
                    <ellipse cx="250" cy="250" rx="220" ry="240" fill="#0a0605" opacity="0.5"/>
                    
                    <!-- Cráneo/cara principal del dragón - más alargada y siniestra -->

                          fill="#1a0e0a" stroke="#2a1510" stroke-width="2"/>
                    
                    <!-- Textura de escamas - realista -->

                    <path d="M250 135 L265 125 L280 135 L265 145 Z" fill="#22120d" stroke="#3a1a12" stroke-width="0.5" opacity="0.6"/>
                    <path d="M280 145 L295 135 L310 145 L295 155 Z" fill="#22120d" stroke="#3a1a12" stroke-width="0.5" opacity="0.6"/>
                    <path d="M310 160 L325 150 L340 160 L325 170 Z" fill="#22120d" stroke="#3a1a12" stroke-width="0.5" opacity="0.6"/>

                    <!-- Cuernos - estilo Juego de Tronos, curvados y afilados -->
                    <path d="M130 120 L80 30 L140 90 L110 40 L155 100" fill="#1a0a05" stroke="#3a1a10" stroke-width="2"/>
                    <path d="M110 140 L50 80 L115 120 L85 90 L130 130" fill="#1a0a05" stroke="#3a1a10" stroke-width="2"/>
                    <path d="M370 120 L420 30 L360 90 L390 40 L345 100" fill="#1a0a05" stroke="#3a1a10" stroke-width="2"/>

                    <ellipse cx="325" cy="200" rx="40" ry="35" fill="#1a0500" stroke="#3a1508" stroke-width="2"/>
                    
                    <!-- Ojos - brillo interno anaranjado/rojo -->
                    <ellipse cx="175" cy="200" rx="32" ry="28" fill="#cc2200" opacity="0.8"/>
                    <ellipse cx="325" cy="200" rx="32" ry="28" fill="#cc2200" opacity="0.8"/>
                    
                    <!-- Pupilas - reptilianas verticales -->
                    <ellipse cx="175" cy="200" rx="6" ry="22" fill="#000000"/>
                    <ellipse cx="325" cy="200" rx="6" ry="22" fill="#000000"/>
                    
                    <!-- Brillo en los ojos - mirada penetrante -->
                    <ellipse cx="168" cy="190" rx="8" ry="5" fill="#ff6633" opacity="0.6"/>
                    <ellipse cx="318" cy="190" rx="8" ry="5" fill="#ff6633" opacity="0.6"/>
                    
                    <!-- Cejas - siniestras y marcadas -->
                    <path d="M135 165 L180 150 L200 158" stroke="#1a0a05" stroke-width="6" fill="none" stroke-linecap="round"/>
                    <path d="M365 165 L320 150 L300 158" stroke="#1a0a05" stroke-width="6" fill="none" stroke-linecap="round"/>
                    
                    <!-- Cresta ósea sobre los ojos -->
                    <path d="M150 140 L175 145 L200 140" stroke="#2a1510" stroke-width="4" fill="none"/>
                    <path d="M350 140 L325 145 L300 140" stroke="#2a1510" stroke-width="4" fill="none"/>
                    
                    <!-- Boca - abierta, siniestra -->
                    <path d="M140 310 Q250 400 360 310" fill="#0a0302" stroke="#2a1008" stroke-width="3"/>
                    
                    <!-- Dientes - irregulares, afilados -->
                    <path d="M155 310 L160 355 L168 310" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M175 305 L182 360 L190 305" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M198 302 L205 362 L212 302" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M220 300 L228 365 L236 300" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M244 300 L252 368 L260 300" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M268 300 L276 368 L284 300" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M292 300 L300 365 L308 300" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M316 302 L324 362 L332 302" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M340 305 L348 360 L356 305" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    
                    <!-- Colmillos inferiores -->
                    <path d="M165 355 L175 330 L185 355" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M195 360 L205 332 L215 360" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M225 365 L235 335 L245 365" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M255 368 L265 335 L275 368" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M285 365 L295 335 L305 365" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M315 360 L325 332 L335 360" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    
                    <!-- Lengua - partida/bífida -->
                    <path d="M200 340 Q250 380 300 340" fill="#661111" stroke="#441111" stroke-width="2"/>
                    <path d="M250 360 L240 385" stroke="#661111" stroke-width="2" fill="none"/>
                    <path d="M250 360 L260 385" stroke="#661111" stroke-width="2" fill="none"/>
                    
                    <!-- Fuego - estilo Drogon (llamas de color rojo/naranja) -->
                    <path d="M190 370 Q230 440 270 370" fill="#dd3300" opacity="0.4"/>
                    <path d="M200 375 Q240 420 280 375" fill="#ff5500" opacity="0.3"/>
                    <path d="M210 380 Q240 400 270 380" fill="#ff8800" opacity="0.2"/>
                    
                    <!-- Nariz - orificios siniestros -->
                    <ellipse cx="215" cy="255" rx="10" ry="7" fill="#050302" stroke="#2a1008" stroke-width="1.5"/>
                    <ellipse cx="285" cy="255" rx="10" ry="7" fill="#050302" stroke="#2a1008" stroke-width="1.5"/>
                    
                    <!-- Sombras profundas bajo los ojos -->
                    <ellipse cx="175" cy="240" rx="50" ry="20" fill="#000000" opacity="0.4"/>
                    <ellipse cx="325" cy="240" rx="50" ry="20" fill="#000000" opacity="0.4"/>
                    
                    <!-- Cicatrices - tétricas -->
                    <path d="M145 230 L155 220 L150 240" stroke="#3a1a10" stroke-width="2" fill="none"/>
                    <path d="M140 250 L155 245" stroke="#3a1a10" stroke-width="1.5" fill="none"/>
                    
                    <!-- Aletas laterales - estilo dragón asiático/tétrico -->
                    <path d="M90 260 L40 280 L60 320 L95 295" fill="#1a0a05" stroke="#2a1510" stroke-width="2"/>
                    <path d="M80 280 L30 300 L55 335 L90 305" fill="#1a0a05" stroke="#2a1510" stroke-width="2"/>
                    <path d="M410 260 L460 280 L440 320 L405 295" fill="#1a0a05" stroke="#2a1510" stroke-width="2"/>
                    <path d="M420 280 L470 300 L445 335 L410 305" fill="#1a0a05" stroke="#2a1510" stroke-width="2"/>
                    
                    <!-- Barbilla - escamosa -->
                    <path d="M200 390 L220 395 L240 390 L260 395 L280 390 L300 395" stroke="#2a1510" stroke-width="1.5" fill="none"/>
                    
                    <!-- Venas oscuras en la cara -->
                    <path d="M150 150 Q170 180 160 210" stroke="#2a0a08" stroke-width="1.5" fill="none" opacity="0.5"/>
                    <path d="M350 150 Q330 180 340 210" stroke="#2a0a08" stroke-width="1.5" fill="none" opacity="0.5"/>
                </svg>
            </div>

            <div class="home-text">🔮 Toca para <span>acceder</span></div>

            <div style="margin-top: 30px; font-size: 0.7rem; color: rgba(200,180,100,0.15); letter-spacing: 4px; font-family: monospace;">
                CLAU PDA 8008206
            </div>
        </div>

        <!-- PANTALLA MENÚ -->
        <div id="menu-screen">
            <button class="back-btn" id="backBtn">← <span>Volver</span></button>

            <div class="icon-grid">
                <a href="https://forms.office.com/r/kNUQlJQSld" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">⚔️</div>
                    <div class="icon-label">ARMAS</div>
                </a>

                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🛡️</div>
                    <div class="icon-label">BALÍSTICO</div>
                </a>

                <a href="https://forms.office.com/r/kNUNUNNNzB" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🚐</div>
                    <div class="icon-label">VEHÍCULOS</div>
                </a>

                <a href="https://segpubcat.eur.evidence.com/axon/device/device-search" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">📷</div>
                    <div class="icon-label">CÁMARAS</div>
                </a>
            </div>

            <div class="clave-pda-bg">CLAU PDA 8008206</div>
        </div>

    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('backBtn');

        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                const win = window.open(url, '_system');
                if (!win || win.closed || typeof win.closed == 'undefined') {
                    window.location.href = url;
                }
            });
        });
    </script>
</body>
</html>
