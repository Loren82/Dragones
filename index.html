<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dracs</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
        body { background-color: #0a0a0f; min-height: 100vh; display: flex; justify-content: center; padding: 16px; align-items: center; }
        
        .app-container {
            width: 100%; max-width: 420px; background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px; padding: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.9);
            position: relative; min-height: 700px; border: 1px solid #2a2a3a;
            display: flex; flex-direction: column;
        }

        /* BARRA SUPERIOR */
        .top-bar {
            display: none; 
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid #2a1a0a;
            margin-bottom: 20px;
        }

        .back-btn-top {
            background: rgba(255,215,0,0.1);
            border: 1px solid #3a3a4a;
            color: #ff2200;
            padding: 8px 16px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .app-title { color: #8a7a5a; font-weight: 700; letter-spacing: 2px; font-size: 0.9rem; }

        /* PANTALLES */
        #home-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; flex-grow: 1; text-align: center; cursor: pointer; }
        #menu-screen { display: none; flex-direction: column; }

        .dragon-image-wrapper { width: 260px; height: 260px; border-radius: 50%; border: 3px solid #ff2200; overflow: hidden; margin-bottom: 30px; animation: dragonPulse 2s infinite; }
        .dragon-image-wrapper img { width: 100%; height: 100%; object-fit: cover; }

        .icon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .icon-item { background: #1a1a22; border-radius: 24px; padding: 20px 10px; text-align: center; text-decoration: none; color: #ccc; border: 1px solid #2a2a3a; display: flex; flex-direction: column; align-items: center; transition: 0.2s; }
        .icon-item:active { transform: translateY(5px); }
        .icon-emoji { font-size: 3rem; margin-bottom: 10px; }
        .icon-label { font-size: 0.7rem; font-weight: 700; color: #c0b090; text-transform: uppercase; }

        @keyframes dragonPulse { 0%, 100% { filter: drop-shadow(0 0 20px rgba(255,0,0,0.3)); } 50% { filter: drop-shadow(0 0 50px rgba(255,0,0,0.6)); } }
    </style>
</head>

<body>
    <div class="app-container">
        
        <!-- BARRA SUPERIOR -->
        <div class="top-bar" id="topBar">
            <button class="back-btn-top" id="backBtn">←</button>
            <div class="app-title">DRACS PDA</div>
            <div style="width: 40px;"></div>
        </div>

        <!-- PANTALLA INICI -->
        <div id="home-screen">
            <div class="dragon-image-wrapper"><img src="ojo_dragon.jpg" alt="Ull de drac"></div>
            <div style="color: #8a7a5a; letter-spacing: 2px;">TOCA PER ACCEDIR</div>
        </div>

        <!-- PANTALLA MENÚ -->
        <div id="menu-screen">
            <div class="icon-grid">
                <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=5IJ0qb4dJUyik3gOc3n0niAcJ-nHf9hBsq5xpGjE_kNUQlJQSldCMDEzNjFZTFo5OFdYVjBHNTRVUCQlQCN0PWcu&origin=QRCode" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">⚔️</div><div class="icon-label">ARMES</div>
                </a>
                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🛡️</div><div class="icon-label">BALÍSTIC</div>
                </a>
                <a href="https://forms.office.com/Pages/ResponsePage.aspx?id=5IJ0qb4dJUyik3gOc3n0niAcJ-nHf9hBsq5xpGjE_kNUNUNNNzBLUEFDUzJaVjkxQzhMU0hQUDdMTiQlQCN0PWcu" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🚐</div><div class="icon-label">VEHICLES</div>
                </a>
                <a href="https://segpubcat.eur.evidence.com/axon/device/device-search" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">📷</div><div class="icon-label">CÀMERES</div>
                </a>
            </div>
        </div>
    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const topBar = document.getElementById('topBar');
        const backBtn = document.getElementById('backBtn');

        // Navegació
        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
            topBar.style.display = 'flex';
        });

        backBtn.addEventListener('click', () => {
            menuScreen.style.display = 'none';
            topBar.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        // Obertura enllaços externs
        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                // Obre en el navegador per defecte del sistema
                window.open(this.getAttribute('href'), '_system');
            });
        });
    </script>
</body>
</html>
