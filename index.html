<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragons</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
            min-height: 700px;
            border: 1px solid #2a2a3a;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
        }

        #home-screen:active {
            transform: scale(0.97);
        }

        .dragon-image-wrapper {
            width: 250px;
            height: 250px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 0 60px rgba(200, 50, 0, 0.4),
                0 0 120px rgba(100, 0, 0, 0.3),
                inset 0 0 60px rgba(0,0,0,0.9);
            border: 2px solid rgba(150, 60, 20, 0.5);
            margin-bottom: 30px;
            background-color: #000000;
        }

        .dragon-image-wrapper svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .home-text {
            color: #8a7a5a;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            border-top: 1px solid #2a1a0a;
            padding-top: 20px;
            width: 80%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .home-text span {
            color: #c4a030;
            font-weight: 700;
        }

        #menu-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
            padding: 10px 0 20px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-item {
            background: linear-gradient(145deg, #1a1a22, #0d0d12);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            border: 1px solid #2a2a3a;
            box-shadow: 0 8px 0 #050508, 0 12px 25px rgba(0,0,0,0.8);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            cursor: pointer;
        }

        .icon-item:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #050508;
        }

        .icon-emoji {
            font-size: 4.2rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .icon-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.04);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a3a4a;
            color: #c0b090;
            text-shadow: 0 0 10px rgba(200,180,100,0.1);
        }

        .clave-pda-bg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(200, 180, 100, 0.08);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(200,180,100,0.05);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
        }

        .back-btn {
            background: none;
            border: none;
            color: #8a7a5a;
            font-size: 1.6rem;
            padding-bottom: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 300;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #c4a030;
        }

        @keyframes dragonBreath {
            0%, 100% { 
                filter: drop-shadow(0 0 30px rgba(200, 50, 0, 0.3));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 80px rgba(255, 80, 0, 0.5));
                transform: scale(1.03);
            }
        }

        .dragon-image-wrapper {
            animation: dragonBreath 3s ease-in-out infinite;
        }
    </style>
</head>

<body>
    <div class="app-container">

        <!-- PANTALLA INICIO -->
        <div id="home-screen">
            <div class="dragon-image-wrapper">
                <!-- DRAGÓN ESTILO JUEGO DE TRONOS - REDISEÑADO Y MÁS TÉTRICO -->
                <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                    <!-- Fondo negro puro -->
                    <rect width="400" height="400" fill="#000000"/>
                    
                    <!-- Cara principal - más ancha y siniestra -->
                    <ellipse cx="200" cy="200" rx="140" ry="160" fill="#0d0806"/>
                    
                    <!-- Textura de piel escamosa -->
                    <ellipse cx="200" cy="200" rx="130" ry="150" fill="none" stroke="#1a0e0a" stroke-width="1" opacity="0.5"/>
                    
                    <!-- Cuernos principales - grandes y curvados hacia atrás -->
                    <path d="M80 130 L30 30 L100 100 L60 40 L120 110" fill="#0d0806" stroke="#3a2015" stroke-width="2"/>
                    <path d="M320 130 L370 30 L300 100 L340 40 L280 110" fill="#0d0806" stroke="#3a2015" stroke-width="2"/>
                    
                    <!-- Cuernos secundarios -->
                    <path d="M100 110 L60 60 L115 100" fill="#0d0806" stroke="#3a2015" stroke-width="1.5"/>
                    <path d="M300 110 L340 60 L285 100" fill="#0d0806" stroke="#3a2015" stroke-width="1.5"/>
                    
                    <!-- Ojos - grandes, rojos brillantes y siniestros -->
                    <ellipse cx="145" cy="170" rx="40" ry="35" fill="#110500" stroke="#2a0a05" stroke-width="2"/>
                    <ellipse cx="255" cy="170" rx="40" ry="35" fill="#110500" stroke="#2a0a05" stroke-width="2"/>
                    
                    <!-- Globo ocular rojo -->
                    <ellipse cx="145" cy="170" rx="35" ry="30" fill="#cc0000"/>
                    <ellipse cx="255" cy="170" rx="35" ry="30" fill="#cc0000"/>
                    
                    <!-- Pupila vertical - reptiliana -->
                    <ellipse cx="145" cy="170" rx="5" ry="25" fill="#000000"/>
                    <ellipse cx="255" cy="170" rx="5" ry="25" fill="#000000"/>
                    
                    <!-- Brillo diabólico en los ojos -->
                    <ellipse cx="138" cy="160" rx="10" ry="6" fill="#ff4400" opacity="0.7"/>
                    <ellipse cx="248" cy="160" rx="10" ry="6" fill="#ff4400" opacity="0.7"/>
                    
                    <!-- Cejas - marcadas y agresivas -->
                    <path d="M100 135 L155 120 L180 130" stroke="#0d0806" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M300 135 L245 120 L220 130" stroke="#0d0806" stroke-width="8" fill="none" stroke-linecap="round"/>
                    
                    <!-- Cresta ósea sobre ojos -->
                    <path d="M120 125 L145 130 L170 125" stroke="#2a1510" stroke-width="5" fill="none"/>
                    <path d="M280 125 L255 130 L230 125" stroke="#2a1510" stroke-width="5" fill="none"/>
                    
                    <!-- Nariz - orificios oscuros -->
                    <ellipse cx="180" cy="220" rx="12" ry="8" fill="#000000" stroke="#2a1008" stroke-width="1.5"/>
                    <ellipse cx="220" cy="220" rx="12" ry="8" fill="#000000" stroke="#2a1008" stroke-width="1.5"/>
                    
                    <!-- Boca abierta - siniestra -->
                    <path d="M110 275 Q200 360 290 275" fill="#050201" stroke="#2a1008" stroke-width="2.5"/>
                    
                    <!-- Dientes superiores - afilados como cuchillas -->
                    <path d="M120 275 L128 320 L136 275" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M145 272 L153 325 L161 272" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M170 270 L178 330 L186 270" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M195 268 L203 335 L211 268" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M220 268 L228 335 L236 268" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M245 270 L253 330 L261 270" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M270 272 L278 325 L286 272" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    
                    <!-- Dientes inferiores - colmillos -->
                    <path d="M135 320 L145 295 L155 320" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M165 330 L175 300 L185 330" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M195 335 L205 302 L215 335" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M225 335 L235 302 L245 335" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M255 330 L265 300 L275 330" fill="#2a1a10" stroke="#1a0a05" stroke-width="1"/>
                    
                    <!-- Lengua - bífida y roja -->
                    <path d="M160 300 Q200 340 240 300" fill="#660000" stroke="#440000" stroke-width="2"/>
                    <path d="M200 320 L190 345" stroke="#660000" stroke-width="2" fill="none"/>
                    <path d="M200 320 L210 345" stroke="#660000" stroke-width="2" fill="none"/>
                    
                    <!-- Fuego - llamas rojas/naranjas -->
                    <path d="M150 340 Q200 410 250 340" fill="#cc2200" opacity="0.5"/>
                    <path d="M160 345 Q200 390 240 345" fill="#ff4400" opacity="0.4"/>
                    <path d="M170 348 Q200 370 230 348" fill="#ff8800" opacity="0.3"/>
                    
                    <!-- Sombras profundas bajo los ojos -->
                    <ellipse cx="145" cy="210" rx="45" ry="25" fill="#000000" opacity="0.5"/>
                    <ellipse cx="255" cy="210" rx="45" ry="25" fill="#000000" opacity="0.5"/>
                    
                    <!-- Cicatriz en el ojo izquierdo -->
                    <path d="M110 190 L125 180 L120 200" stroke="#3a1a10" stroke-width="2.5" fill="none"/>
                    <path d="M115 195 L130 190" stroke="#3a1a10" stroke-width="2" fill="none"/>
                    
                    <!-- Venas oscuras -->
                    <path d="M120 130 Q140 160 130 190" stroke="#1a0805" stroke-width="2" fill="none" opacity="0.6"/>
                    <path d="M280 130 Q260 160 270 190" stroke="#1a0805" stroke-width="2" fill="none" opacity="0.6"/>
                    
                    <!-- Aletas laterales - tétricas -->
                    <path d="M60 230 L20 250 L40 290 L70 260" fill="#0d0806" stroke="#2a1510" stroke-width="2"/>
                    <path d="M50 250 L10 270 L30 310 L60 280" fill="#0d0806" stroke="#2a1510" stroke-width="2"/>
                    <path d="M340 230 L380 250 L360 290 L330 260" fill="#0d0806" stroke="#2a1510" stroke-width="2"/>
                    <path d="M350 250 L390 270 L370 310 L340 280" fill="#0d0806" stroke="#2a1510" stroke-width="2"/>
                    
                    <!-- Escamas en la frente -->
                    <path d="M175 145 L185 135 L195 145 L185 155 Z" fill="#150a08" stroke="#2a1510" stroke-width="0.5" opacity="0.7"/>
                    <path d="M195 140 L205 130 L215 140 L205 150 Z" fill="#150a08" stroke="#2a1510" stroke-width="0.5" opacity="0.7"/>
                    <path d="M215 145 L225 135 L235 145 L225 155 Z" fill="#150a08" stroke="#2a1510" stroke-width="0.5" opacity="0.7"/>
                    
                    <!-- Barbilla escamosa -->
                    <path d="M170 355 L185 360 L200 355 L215 360 L230 355" stroke="#2a1510" stroke-width="1.5" fill="none"/>
                </svg>
            </div>

            <div class="home-text">🔮 Toca para <span>acceder</span></div>

            <div style="margin-top: 30px; font-size: 0.7rem; color: rgba(200,180,100,0.15); letter-spacing: 4px; font-family: monospace;">
                CLAU PDA 8008206
            </div>
        </div>

        <!-- PANTALLA MENÚ -->
        <div id="menu-screen">
            <button class="back-btn" id="backBtn">← <span>Volver</span></button>

            <div class="icon-grid">
                <a href="https://forms.office.com/r/kNUQlJQSld" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">⚔️</div>
                    <div class="icon-label">ARMAS</div>
                </a>

                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🛡️</div>
                    <div class="icon-label">BALÍSTICO</div>
                </a>

                <a href="https://forms.office.com/r/kNUNUNNNzB" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🚐</div>
                    <div class="icon-label">VEHÍCULOS</div>
                </a>

                <a href="https://segpubcat.eur.evidence.com/axon/device/device-search" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">📷</div>
                    <div class="icon-label">CÁMARAS</div>
                </a>
            </div>

            <div class="clave-pda-bg">CLAU PDA 8008206</div>
        </div>

    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('backBtn');

        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                const win = window.open(url, '_system');
                if (!win || win.closed || typeof win.closed == 'undefined') {
                    window.location.href = url;
                }
            });
        });
    </script>
</body>
</html>
