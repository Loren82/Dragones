<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragons</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
            min-height: 700px;
            border: 1px solid #2a2a3a;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
        }

        #home-screen:active {
            transform: scale(0.97);
        }

        .dragon-image-wrapper {
            width: 220px;
            height: 220px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 0 40px rgba(255, 69, 0, 0.5),
                0 0 80px rgba(255, 0, 0, 0.2),
                inset 0 0 20px rgba(0,0,0,0.8);
            border: 2px solid rgba(255, 69, 0, 0.6);
            margin-bottom: 30px;
            background-color: #000;
        }

        .dragon-image-wrapper svg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .home-text {
            color: #ccb27a;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            border-top: 1px solid #3a2a1a;
            padding-top: 20px;
            width: 80%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .home-text span {
            color: #f5d742;
            font-weight: 700;
        }

        #menu-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
            padding: 10px 0 20px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-item {
            background: linear-gradient(145deg, #222233, #13131e);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #eee;
            border: 1px solid #3a3a50;
            box-shadow: 0 8px 0 #0a0a0f, 0 12px 25px rgba(0,0,0,0.6);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            cursor: pointer;
        }

        .icon-item:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #0a0a0f;
        }

        .icon-emoji {
            font-size: 4.2rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .icon-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.06);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #4a4a60;
            color: #f0e6c5;
            text-shadow: 0 0 10px rgba(255,215,0,0.2);
        }

        .clave-pda-bg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(255, 215, 0, 0.15);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,200,0,0.1);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
        }

        .back-btn {
            background: none;
            border: none;
            color: #bbaa88;
            font-size: 1.6rem;
            padding-bottom: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 300;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #f5d742;
        }

        /* Animación del dragón */
        @keyframes dragonPulse {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.6));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 40px rgba(255, 0, 0, 0.9));
                transform: scale(1.05);
            }
        }

        .dragon-image-wrapper {
            animation: dragonPulse 3s ease-in-out infinite;
        }

        @keyframes fireGlow {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .fire-glow {
            animation: fireGlow 0.8s ease-in-out infinite alternate;
        }
    </style>
</head>

<body>
    <div class="app-container">

        <!-- PANTALLA INICIO -->
        <div id="home-screen">
            <div class="dragon-image-wrapper">
                <!-- CABEZA DE DRAGÓN ESTILO TERROR - SVG -->
                <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
                    <!-- Fondo oscuro -->
                    <rect width="500" height="500" fill="#0a0505" rx="20"/>
                    
                    <!-- Cara principal del dragón -->
                    <ellipse cx="250" cy="250" rx="180" ry="200" fill="#2a1515" stroke="#441111" stroke-width="3"/>
                    
                    <!-- Cuernos izquierdos -->
                    <path d="M100 150 L70 50 L130 130 L110 60 L150 140" fill="#3a1a1a" stroke="#661111" stroke-width="2"/>
                    <path d="M80 160 L40 80 L110 140 L90 90 L130 150" fill="#3a1a1a" stroke="#661111" stroke-width="2"/>
                    
                    <!-- Cuernos derechos -->
                    <path d="M400 150 L430 50 L370 130 L390 60 L350 140" fill="#3a1a1a" stroke="#661111" stroke-width="2"/>
                    <path d="M420 160 L460 80 L390 140 L410 90 L370 150" fill="#3a1a1a" stroke="#661111" stroke-width="2"/>
                    
                    <!-- Ojos - ROJOS BRILLANTES -->
                    <ellipse cx="190" cy="200" rx="45" ry="40" fill="#ff0000" stroke="#aa0000" stroke-width="3"/>
                    <ellipse cx="310" cy="200" rx="45" ry="40" fill="#ff0000" stroke="#aa0000" stroke-width="3"/>
                    
                    <!-- Pupilas - NEGRAS VERTICALES -->
                    <ellipse cx="190" cy="200" rx="15" ry="30" fill="#000000"/>
                    <ellipse cx="310" cy="200" rx="15" ry="30" fill="#000000"/>
                    
                    <!-- Brillo en los ojos -->
                    <ellipse cx="180" cy="185" rx="12" ry="8" fill="#ff6666" opacity="0.8"/>
                    <ellipse cx="300" cy="185" rx="12" ry="8" fill="#ff6666" opacity="0.8"/>
                    
                    <!-- Cejas - AGRESIVAS -->
                    <path d="M140 160 L190 140 L210 150" stroke="#661111" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M360 160 L310 140 L290 150" stroke="#661111" stroke-width="8" fill="none" stroke-linecap="round"/>
                    
                    <!-- Boca - ABIERTA CON DIENTES -->
                    <path d="M160 300 Q250 380 340 300" fill="#1a0000" stroke="#661111" stroke-width="3"/>
                    
                    <!-- Dientes SUPERIORES -->
                    <path d="M180 300 L185 340 L190 300" fill="#dddddd" stroke="#999999" stroke-width="1"/>
                    <path d="M210 295 L215 345 L220 295" fill="#dddddd" stroke="#999999" stroke-width="1"/>
                    <path d="M240 292 L245 348 L250 292" fill="#dddddd" stroke="#999999" stroke-width="1"/>
                    <path d="M270 292 L275 348 L280 292" fill="#dddddd" stroke="#999999" stroke-width="1"/>
                    <path d="M300 295 L305 345 L310 295" fill="#dddddd" stroke="#999999" stroke-width="1"/>
                    <path d="M330 300 L335 340 L340 300" fill="#dddddd" stroke="#999999" stroke-width="1"/>
                    
                    <!-- Dientes INFERIORES -->
                    <path d="M185 340 L190 320 L195 340" fill="#cccccc" stroke="#999999" stroke-width="1"/>
                    <path d="M215 345 L220 320 L225 345" fill="#cccccc" stroke="#999999" stroke-width="1"/>
                    <path d="M245 348 L250 320 L255 348" fill="#cccccc" stroke="#999999" stroke-width="1"/>
                    <path d="M275 348 L280 320 L285 348" fill="#cccccc" stroke="#999999" stroke-width="1"/>
                    <path d="M305 345 L310 320 L315 345" fill="#cccccc" stroke="#999999" stroke-width="1"/>
                    
                    <!-- Lengua - ROJA -->
                    <path d="M220 340 Q250 370 280 340" fill="#ff2222" stroke="#cc0000" stroke-width="2"/>
                    
                    <!-- Fuego de la boca -->
                    <path d="M200 350 Q250 420 300 350" fill="#ff4400" opacity="0.6"/>
                    <path d="M210 355 Q250 400 290 355" fill="#ff8800" opacity="0.4"/>
                    <path d="M220 360 Q250 380 280 360" fill="#ffcc00" opacity="0.3"/>
                    
                    <!-- Escamas en la frente -->
                    <path d="M220 170 L230 190 L240 170" fill="#3a2020" stroke="#552222" stroke-width="1"/>
                    <path d="M240 165 L250 185 L260 165" fill="#3a2020" stroke="#552222" stroke-width="1"/>
                    <path d="M260 170 L270 190 L280 170" fill="#3a2020" stroke="#552222" stroke-width="1"/>
                    
                    <!-- Cicatriz en el ojo izquierdo -->
                    <path d="M160 230 L175 220 L170 235" stroke="#661111" stroke-width="2" fill="none"/>
                    
                    <!-- Aletas laterales -->
                    <path d="M100 260 L60 280 L80 310 L110 290" fill="#3a1515" stroke="#552222" stroke-width="2"/>
                    <path d="M400 260 L440 280 L420 310 L390 290" fill="#3a1515" stroke="#552222" stroke-width="2"/>
                    
                    <!-- Nariz - ORIFICIOS -->
                    <ellipse cx="220" cy="250" rx="15" ry="10" fill="#1a0505" stroke="#441111" stroke-width="2"/>
                    <ellipse cx="280" cy="250" rx="15" ry="10" fill="#1a0505" stroke="#441111" stroke-width="2"/>
                    
                    <!-- Sombras de los ojos -->
                    <ellipse cx="190" cy="240" rx="50" ry="15" fill="#000000" opacity="0.3"/>
                    <ellipse cx="310" cy="240" rx="50" ry="15" fill="#000000" opacity="0.3"/>
                </svg>
            </div>

            <div class="home-text">🔮 Toca para <span>acceder</span></div>

            <div style="margin-top: 30px; font-size: 0.7rem; color: rgba(255,215,0,0.2); letter-spacing: 4px; font-family: monospace;">
                CLAU PDA 8008206
            </div>
        </div>

        <!-- PANTALLA MENÚ -->
        <div id="menu-screen">
            <button class="back-btn" id="backBtn">← <span>Volver</span></button>

            <div class="icon-grid">
                <a href="https://forms.office.com/r/kNUQlJQSld" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">⚔️</div>
                    <div class="icon-label">ARMAS</div>
                </a>

                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🛡️</div>
                    <div class="icon-label">BALÍSTICO</div>
                </a>

                <a href="https://forms.office.com/r/kNUNUNNNzB" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🚐</div>
                    <div class="icon-label">VEHÍCULOS</div>
                </a>

                <a href="https://segpubcat.eur.evidence.com/axon/device/device-search" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">📷</div>
                    <div class="icon-label">CÁMARAS</div>
                </a>
            </div>

            <div class="clave-pda-bg">CLAU PDA 8008206</div>
        </div>

    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('backBtn');

        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                const win = window.open(url, '_system');
                if (!win || win.closed || typeof win.closed == 'undefined') {
                    window.location.href = url;
                }
            });
        });
    </script>
</body>
</html>
