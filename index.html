<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, user-scalable=yes">
    <title>Dracs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
            touch-action: pan-x pan-y pinch-zoom;
            -webkit-text-size-adjust: 100%;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
            min-height: 700px;
            border: 1px solid #2a2a3a;
        }

        @media (orientation: landscape) and (max-height: 600px) {
            .app-container {
                max-width: 600px;
                min-height: auto;
                padding: 16px;
                border-radius: 20px;
            }
            
            #home-screen {
                min-height: auto;
                padding: 20px 0;
            }
            
            .dragon-image-wrapper {
                width: 150px;
                height: 150px;
                margin-bottom: 15px;
            }
            
            .icon-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            
            .icon-item {
                min-height: 100px;
                padding: 10px 5px;
            }
            
            .icon-emoji {
                font-size: 3rem;
                margin-bottom: 4px;
            }
            
            .icon-label {
                font-size: 0.7rem;
                letter-spacing: 1px;
                padding: 3px 10px;
            }
            
            .clave-pda-bg {
                position: relative;
                bottom: auto;
                margin-top: 15px;
                font-size: 1.4rem;
            }
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
        }

        #home-screen:active {
            transform: scale(0.97);
        }

        .dragon-image-wrapper {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 0 60px rgba(255, 0, 0, 0.6),
                0 0 120px rgba(255, 0, 0, 0.3),
                inset 0 0 60px rgba(0,0,0,0.9);
            border: 3px solid #ff2200;
            margin-bottom: 30px;
            background-color: #000000;
            animation: dragonPulse 2s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dragon-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .dragon-fallback {
            font-size: 6rem;
            filter: drop-shadow(0 0 20px rgba(255,0,0,0.8));
        }

        .home-text {
            color: #8a7a5a;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            border-top: 1px solid #2a1a0a;
            padding-top: 20px;
            width: 80%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .home-text span {
            color: #ff2200;
            font-weight: 700;
        }

        #menu-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
            padding: 10px 0 20px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-item {
            background: linear-gradient(145deg, #1a1a22, #0d0d12);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            border: 1px solid #2a2a3a;
            box-shadow: 0 8px 0 #050508, 0 12px 25px rgba(0,0,0,0.8);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            cursor: pointer;
        }

        .icon-item:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #050508;
        }

        .icon-emoji {
            font-size: 4.2rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .icon-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.04);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a3a4a;
            color: #c0b090;
            text-shadow: 0 0 10px rgba(200,180,100,0.1);
        }

        .clave-pda-bg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffff33;
            opacity: 0.85;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255,255,100,0.4);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
        }

        .back-btn {
            background: none;
            border: none;
            color: #8a7a5a;
            font-size: 1.6rem;
            padding-bottom: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 300;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #c4a030;
        }

        @keyframes dragonPulse {
            0%, 100% { 
                filter: drop-shadow(0 0 30px rgba(255,0,0,0.3));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 80px rgba(255,0,0,0.8));
                transform: scale(1.03);
            }
        }
    </style>
</head>

<body>
    <div class="app-container">

        <!-- PANTALLA INICI -->
        <div id="home-screen">
            
            <div class="dragon-image-wrapper" id="dragonWrapper">
                <img src="ojo_dragon.jpg" alt="Ull de drac" id="dragonImage" onerror="showDragonFallback()">
            </div>

            <div class="home-text">🔮 Toca per <span>accedir</span></div>

            <div style="margin-top: 30px; font-size: 0.7rem; color: rgba(200,180,100,0.15); letter-spacing: 4px; font-family: monospace;">
                CLAU PDA 8008206
            </div>
        </div>

        <!-- PANTALLA MENÚ -->
        <div id="menu-screen">
            <button class="back-btn" id="backBtn">← <span>Tornar</span></button>

            <div class="icon-grid">

                <div class="icon-item external-link" data-url="https://forms.office.com/Pages/ResponsePage.aspx?id=5IJ0qb4dJUyik3gOc3n0niAcJ-nHf9hBsq5xpGjE_kNUQlJQSldCMDEzNjFZTFo5OFdYVjBHNTRVUCQlQCN0PWcu&origin=QRCode">
                    <div class="icon-emoji">⚔️</div>
                    <div class="icon-label">ARMES</div>
                </div>

                <div class="icon-item external-link" data-url="https://forms.office.com/e/HutLxU4Xqr">
                    <div class="icon-emoji">🛡️</div>
                    <div class="icon-label">BALÍSTIC</div>
                </div>

                <div class="icon-item external-link" data-url="https://forms.office.com/Pages/ResponsePage.aspx?id=5IJ0qb4dJUyik3gOc3n0niAcJ-nHf9hBsq5xpGjE_kNUNUNNNzBLUEFDUzJaVjkxQzhMU0hQUDdMTiQlQCN0PWcu">
                    <div class="icon-emoji">🚐</div>
                    <div class="icon-label">VEHICLES</div>
                </div>

                <div class="icon-item external-link" data-url="https://segpubcat.eur.evidence.com/axon/device/device-search">
                    <div class="icon-emoji">📷</div>
                    <div class="icon-label">CÀMERES</div>
                </div>
            </div>

            <div class="clave-pda-bg">CLAU PDA 8008206</div>
        </div>

    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('backBtn');

        // Función para mostrar fallback si la imagen no carga
        function showDragonFallback() {
            const wrapper = document.getElementById('dragonWrapper');
            wrapper.innerHTML = '<div class="dragon-fallback">🐉</div>';
        }

        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        // FUNCIÓN CRÍTICA: Abrir enlaces en navegador externo cuando está en APK
        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('data-url');
                
                // Detectar si estamos en Android WebView
                const isAndroid = /Android/i.test(navigator.userAgent);
                
                if (isAndroid) {
                    // Intentar usar el intent de Android para abrir en navegador externo
                    try {
                        // Método 1: Usar location.href con intent
                        const intentUrl = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;action=android.intent.action.VIEW;end';
                        window.location.href = intentUrl;
                        
                        // Método 2: Fallback después de 1 segundo
                        setTimeout(() => {
                            const tempLink = document.createElement('a');
                            tempLink.href = url;
                            tempLink.target = '_blank';
                            tempLink.rel = 'noopener noreferrer';
                            document.body.appendChild(tempLink);
                            tempLink.click();
                            document.body.removeChild(tempLink);
                        }, 1000);
                    } catch (error) {
                        // Método 3: Fallback final
                        window.open(url, '_blank');
                    }
                } else {
                    // Para iOS u otros
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
            });
        });

        // Prevenir doble tap accidental pero permitir zoom
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });
    </script>
</body>
</html>
