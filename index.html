<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dragons - Accesos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { 
            background-color: #0a0a0f; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; /* Evita scroll en el body */
        }

        .app-container {
            width: 95%;
            max-width: 420px;
            height: 90vh; /* Ajuste para evitar desbordes */
            background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid #2a2a3a;
            overflow: hidden;
        }

        /* Pantallas */
        #home-screen, #menu-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #menu-screen { 
            display: none; 
            overflow-y: auto; /* Permite scroll si los iconos no caben */
            padding-top: 10px;
        }

        /* Ajustes de centrado para el home */
        #home-screen { justify-content: center; }

        /* Ajustes de la cuadrícula de iconos */
        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        .icon-item {
            background: #1e1e2d;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            color: white;
            border: 1px solid #3a3a50;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Asegurar que el contenido del menú no se corte */
        .back-btn { align-self: flex-start; margin-bottom: 10px; cursor: pointer; color: #bbaa88; background: none; border: none; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- PANTALLA DE INICIO -->
        <div id="home-screen">
            <div class="dragon-eye">
                <div class="eye-number">42</div>
            </div>
            <div class="home-text">🔮 Toca para <span>acceder</span></div>
        </div>

        <!-- PANTALLA DE MENÚ -->
        <div id="menu-screen">
            <button class="back-btn" id="backBtn">← Volver</button>
            <div class="icon-grid">
                <a href="https://forms.office.com/r/kNUQlJQSld" target="_blank" class="icon-item">...</a>
                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" class="icon-item">...</a>
                <!-- Resto de tus items -->
            </div>
        </div>
    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        
        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        });

        document.getElementById('backBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });
    </script>
</body>
</html>
