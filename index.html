<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dracs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            border-radius: 40px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
            min-height: 700px;
            border: 1px solid #2a2a3a;
            background: transparent;
        }

        /* 🐉 PANTALLA INICI CENTRADA PERFECTAMENT */
        #home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            cursor: pointer;
        }

        .dragon-image-wrapper {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 0 60px rgba(255, 0, 0, 0.6),
                0 0 120px rgba(255, 0, 0, 0.3),
                inset 0 0 60px rgba(0,0,0,0.9);
            border: 3px solid #ff2200;
            background-color: #000000;
            animation: dragonPulse 2s ease-in-out infinite;
            margin-bottom: 20px;
        }

        .dragon-image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .home-text {
            color: #8a7a5a;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .home-text span {
            color: #ff2200;
            font-weight: 700;
        }

        /* 🛡️ SEGONA PANTALLA AMB FONS ESCUT */
        #menu-screen {
            display: none;
            flex-direction: column;
            justify-content: space-between; /* Distribueix el contingut dalt, mig i baix */
            align-items: center;
            background-image: url('escudo.jpg');
            background-size: cover;
            background-position: center; /* Centra l'escut */
            background-repeat: no-repeat;
            height: 700px; /* Manté l'alçada del contenidor */
            padding: 20px 0;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            padding: 0 20px;
            margin: auto 0; /* Centra verticalment la graella */
        }

        .icon-item {
            background: rgba(0,0,0,0.65);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            border: 1px solid #2a2a3a;
            box-shadow: 0 8px 0 #050508, 0 12px 25px rgba(0,0,0,0.8);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
        }

        .icon-emoji {
            font-size: 4.2rem;
            margin-bottom: 6px;
        }

        .icon-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.04);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a3a4a;
            color: #c0b090;
        }

        /* 🔥 TEXT FLUORESCENT CENTRAT A BAIX */
        .clave-pda-bg {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffff33;
            opacity: 0.85;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255,255,100,0.4);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
            margin-bottom: 10px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #8a7a5a;
            font-size: 1.6rem;
            padding: 20px;
            cursor: pointer;
            align-self: flex-start; /* Alineat a l'esquerra superior */
            z-index: 20;
        }

        @keyframes dragonPulse {
            0%, 100% { filter: drop-shadow(0 0 30px rgba(255,0,0,0.3)); transform: scale(1); }
            50% { filter: drop-shadow(0 0 80px rgba(255,0,0,0.8)); transform: scale(1.03); }
        }
    </style>
</head>

<body>
    <div class="app-container">

        <div id="home-screen">
            <div class="dragon-image-wrapper">
                <img src="ojo_dragon.jpg" alt="Ull de drac">
            </div>
            <div class="home-text">🔮 Toca per <span>accedir</span></div>
        </div>

        <div id="menu-screen">
            <button class="back-btn" id="backBtn">←</button>

            <div class="icon-grid">
                <a href="#" class="icon-item"><div class="icon-emoji">⚔️</div><div class="icon-label">ARMES</div></a>
                <a href="#" class="icon-item"><div class="icon-emoji">🛡️</div><div class="icon-label">BALÍSTIC</div></a>
                <a href="#" class="icon-item"><div class="icon-emoji">🚐</div><div class="icon-label">VEHICLES</div></a>
                <a href="#" class="icon-item"><div class="icon-emoji">📷</div><div class="icon-label">CÀMERES</div></a>
            </div>

            <div class="clave-pda-bg">CLAU PDA 8008206</div>
        </div>

    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('backBtn');

        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });
    </script>
</body>
</html>
