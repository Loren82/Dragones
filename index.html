<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragons</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            background-color: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(145deg, #1a1a24, #0d0d12);
            border-radius: 40px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,0,0,0.9), inset 0 0 0 1px rgba(255,215,0,0.15);
            position: relative;
            overflow: hidden;
            min-height: 700px;
            border: 1px solid #2a2a3a;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 600px;
            text-align: center;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.3s ease;
        }

        #home-screen:active {
            transform: scale(0.97);
        }

        .dragon-image-wrapper {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow:
                0 0 60px rgba(255, 0, 0, 0.6),
                0 0 120px rgba(255, 0, 0, 0.3),
                inset 0 0 60px rgba(0,0,0,0.9);
            border: 3px solid #ff2200;
            margin-bottom: 30px;
            background-color: #000000;
        }

        .dragon-image-wrapper svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .home-text {
            color: #8a7a5a;
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 10px;
            border-top: 1px solid #2a1a0a;
            padding-top: 20px;
            width: 80%;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .home-text span {
            color: #ff2200;
            font-weight: 700;
        }

        #menu-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
            padding: 10px 0 20px;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 10px;
        }

        .icon-item {
            background: linear-gradient(145deg, #1a1a22, #0d0d12);
            border-radius: 24px;
            padding: 20px 10px;
            text-align: center;
            text-decoration: none;
            color: #ccc;
            border: 1px solid #2a2a3a;
            box-shadow: 0 8px 0 #050508, 0 12px 25px rgba(0,0,0,0.8);
            transition: all 0.1s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 130px;
            cursor: pointer;
        }

        .icon-item:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #050508;
        }

        .icon-emoji {
            font-size: 4.2rem;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.6));
        }

        .icon-label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.04);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid #3a3a4a;
            color: #c0b090;
            text-shadow: 0 0 10px rgba(200,180,100,0.1);
        }

        .clave-pda-bg {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            color: rgba(200, 180, 100, 0.08);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(200,180,100,0.05);
            pointer-events: none;
            font-family: 'Courier New', monospace;
            transform: rotate(-2deg);
        }

        .back-btn {
            background: none;
            border: none;
            color: #8a7a5a;
            font-size: 1.6rem;
            padding-bottom: 10px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 300;
            transition: 0.2s;
        }

        .back-btn:hover {
            color: #c4a030;
        }

        @keyframes dragonPulse {
            0%, 100% { 
                filter: drop-shadow(0 0 30px rgba(255,0,0,0.3));
                transform: scale(1);
            }
            50% { 
                filter: drop-shadow(0 0 80px rgba(255,0,0,0.8));
                transform: scale(1.03);
            }
        }

        .dragon-image-wrapper {
            animation: dragonPulse 2s ease-in-out infinite;
        }

        /* ANIMACIÓN DEL OJO - PARPADEO LENTO */
        @keyframes eyeBlink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .eye-blink {
            animation: eyeBlink 4s ease-in-out infinite;
            transform-origin: center;
        }
    </style>
</head>

<body>
    <div class="app-container">

        <!-- PANTALLA INICIO -->
        <div id="home-screen">
            <div class="dragon-image-wrapper">
                <!-- DRAGÓN CON UN OJO - ESTILO TERROR -->
                <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                    <!-- Fondo -->
                    <rect width="300" height="300" fill="#000000"/>
                    
                    <!-- Cara del dragón -->
                    <ellipse cx="150" cy="145" rx="100" ry="110" fill="#1a0a06"/>
                    <ellipse cx="150" cy="145" rx="85" ry="95" fill="#2a1510"/>
                    
                    <!-- Cuernos principales -->
                    <path d="M70 100 L20 10 L90 80 L50 20 L110 90" fill="#1a0a05" stroke="#3a2010" stroke-width="2"/>
                    <path d="M230 100 L280 10 L210 80 L250 20 L190 90" fill="#1a0a05" stroke="#3a2010" stroke-width="2"/>
                    
                    <!-- Cuernos secundarios -->
                    <path d="M85 85 L55 35 L100 80" fill="#1a0a05" stroke="#3a2010" stroke-width="1.5"/>
                    <path d="M215 85 L245 35 L200 80" fill="#1a0a05" stroke="#3a2010" stroke-width="1.5"/>
                    
                    <!-- OJO ÚNICO GIGANTE -->
                    <ellipse cx="150" cy="130" rx="55" ry="50" fill="#0a0200" stroke="#ff2200" stroke-width="3"/>
                    
                    <!-- Globo ocular ROJO -->
                    <ellipse cx="150" cy="130" rx="48" ry="43" fill="#ff0000"/>
                    
                    <!-- Brillo interior naranja -->
                    <ellipse cx="150" cy="130" rx="35" ry="30" fill="#ff4400" opacity="0.5"/>
                    
                    <!-- Pupila vertical NEGRA -->
                    <ellipse cx="150" cy="130" rx="8" ry="35" fill="#000000"/>
                    
                    <!-- Brillo del ojo -->
                    <ellipse cx="140" cy="115" rx="15" ry="8" fill="#ffffff" opacity="0.9"/>
                    <ellipse cx="145" cy="108" rx="8" ry="4" fill="#ffffff" opacity="0.6"/>
                    
                    <!-- Cejas agresivas -->
                    <path d="M90 100 L150 85 L210 100" stroke="#0d0806" stroke-width="8" fill="none" stroke-linecap="round"/>
                    
                    <!-- Boca abierta -->
                    <path d="M90 220 Q150 290 210 220" fill="#0a0302" stroke="#3a1a0a" stroke-width="2.5"/>
                    
                    <!-- Dientes superiores -->
                    <path d="M100 220 L108 255 L116 220" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M120 218 L128 260 L136 218" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M140 216 L148 265 L156 216" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M160 216 L168 265 L176 216" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M180 218 L188 260 L196 218" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M200 220 L208 255 L216 220" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    
                    <!-- Colmillos inferiores -->
                    <path d="M110 255 L120 232 L130 255" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M140 265 L150 238 L160 265" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    <path d="M170 265 L180 238 L190 265" fill="#3a2a1a" stroke="#1a0a05" stroke-width="1"/>
                    
                    <!-- Lengua bífida -->
                    <path d="M130 240 Q150 265 170 240" fill="#cc0000" stroke="#880000" stroke-width="1.5"/>
                    <path d="M150 255 L143 272" stroke="#cc0000" stroke-width="2" fill="none"/>
                    <path d="M150 255 L157 272" stroke="#cc0000" stroke-width="2" fill="none"/>
                    
                    <!-- Fuego -->
                    <path d="M120 280 Q150 330 180 280" fill="#ff4400" opacity="0.6"/>
                    <path d="M130 285 Q150 310 170 285" fill="#ff8800" opacity="0.5"/>
                    <path d="M138 288 Q150 300 162 288" fill="#ffcc00" opacity="0.4"/>
                    
                    <!-- Nariz -->
                    <ellipse cx="135" cy="180" rx="10" ry="7" fill="#050302" stroke="#2a1008" stroke-width="1.5"/>
                    <ellipse cx="165" cy="180" rx="10" ry="7" fill="#050302" stroke="#2a1008" stroke-width="1.5"/>
                    
                    <!-- Cicatriz -->
                    <path d="M80 150 L100 135 L95 160" stroke="#ff2200" stroke-width="2.5" fill="none"/>
                    
                    <!-- Aletas laterales -->
                    <path d="M50 200 L15 220 L35 250 L60 225" fill="#1a0a05" stroke="#2a1510" stroke-width="1.5"/>
                    <path d="M250 200 L285 220 L265 250 L240 225" fill="#1a0a05" stroke="#2a1510" stroke-width="1.5"/>
                    
                    <!-- Escamas -->
                    <path d="M135 105 L142 95 L149 105 L142 115 Z" fill="#3a1a10" stroke="#4a2a18" stroke-width="0.5"/>
                    <path d="M149 100 L156 90 L163 100 L156 110 Z" fill="#3a1a10" stroke="#4a2a18" stroke-width="0.5"/>
                    <path d="M163 105 L170 95 L177 105 L170 115 Z" fill="#3a1a10" stroke="#4a2a18" stroke-width="0.5"/>
                </svg>
            </div>

            <div class="home-text">🔮 Toca para <span>acceder</span></div>

            <div style="margin-top: 30px; font-size: 0.7rem; color: rgba(200,180,100,0.15); letter-spacing: 4px; font-family: monospace;">
                CLAU PDA 8008206
            </div>
        </div>

        <!-- PANTALLA MENÚ -->
        <div id="menu-screen">
            <button class="back-btn" id="backBtn">← <span>Volver</span></button>

            <div class="icon-grid">
                <a href="https://forms.office.com/r/kNUQlJQSld" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">⚔️</div>
                    <div class="icon-label">ARMAS</div>
                </a>

                <a href="https://forms.office.com/e/HutLxU4Xqr" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🛡️</div>
                    <div class="icon-label">BALÍSTICO</div>
                </a>

                <a href="https://forms.office.com/r/kNUNUNNNzB" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">🚐</div>
                    <div class="icon-label">VEHÍCULOS</div>
                </a>

                <a href="https://segpubcat.eur.evidence.com/axon/device/device-search" target="_blank" class="icon-item external-link">
                    <div class="icon-emoji">📷</div>
                    <div class="icon-label">CÁMARAS</div>
                </a>
            </div>

            <div class="clave-pda-bg">CLAU PDA 8008206</div>
        </div>

    </div>

    <script>
        const homeScreen = document.getElementById('home-screen');
        const menuScreen = document.getElementById('menu-screen');
        const backBtn = document.getElementById('backBtn');

        homeScreen.addEventListener('click', () => {
            homeScreen.style.display = 'none';
            menuScreen.style.display = 'flex';
        });

        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            menuScreen.style.display = 'none';
            homeScreen.style.display = 'flex';
        });

        document.querySelectorAll('.external-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const url = this.getAttribute('href');
                const win = window.open(url, '_system');
                if (!win || win.closed || typeof win.closed == 'undefined') {
                    window.location.href = url;
                }
            });
        });
    </script>
</body>
</html>
